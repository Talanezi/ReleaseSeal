[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseseal"
version = "0.0.0"
description = "Local-first pre-publish QA for video creators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
releaseseal = "releaseseal.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
transcription = [
  "faster-whisper>=1.1,<2",
]
ai = [
  "google-genai>=2.22,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
