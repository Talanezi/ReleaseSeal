name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require hosted API URL
        env:
          RELEASESEAL_API_BASE_URL: ${{ vars.RELEASESEAL_API_BASE_URL }}
        run: test -n "$RELEASESEAL_API_BASE_URL" || { echo "Set the RELEASESEAL_API_BASE_URL repository variable before deploying Pages."; exit 1; }
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build GitHub Pages application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.RELEASESEAL_API_BASE_URL }}
        run: npm run build -- --mode github-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
